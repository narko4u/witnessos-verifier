[project]
name = "witnessos-verifier"
# Single source of truth for the project version. Bump it here and nowhere else.
# The package reads the value back from the installed distribution metadata, so
# the distribution filename, the wheel metadata and 'witnessos-verifier
# --version' cannot disagree again. They drifted once, when __init__.py carried a
# second copy of the version that the release process could not reach, and the
# wheel was named 0.3.3 while '--version' still printed 0.2.0.
version = "0.3.4"
description = "Standalone open-source verifier for WitnessOS™ evidence: Ed25519 and ML-DSA-65 hybrid signatures, Merkle chains, RFC 3161 timestamps"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "Empire Labs Pty Ltd", email = "contact@empirelabs.com.au"},
]
keywords = ["witnessos", "ai-agents", "evidence", "verification", "audit", "cryptography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "asn1crypto>=1.5.1",
    "click>=8.0",
    "cryptography>=50.0",
    "pynacl>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
trust = [
    "cryptography>=50.0",
]
s3 = [
    "boto3>=1.35.0",
]

[project.scripts]
witnessos-verifier = "witnessos_verifier.cli:main"

[project.urls]
Homepage = "https://github.com/narko4u/witnessos-verifier"
Repository = "https://github.com/narko4u/witnessos-verifier"
Issues = "https://github.com/narko4u/witnessos-verifier/issues"
Changelog = "https://github.com/narko4u/witnessos-verifier/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
