name: Release

# Build release assets, generate a CycloneDX SBOM, sign every artifact
# keylessly with Sigstore/cosign (GitHub OIDC), and publish to the release.
# - SBOM: https://www.bestpractices.dev/en/criteria -> OSPS-QA-02.02
# - Signing + identity: OSPS-DO-03.01 / OSPS-DO-03.02

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to backfill (e.g. v0.2.0). Leave empty to use the pushed tag."
        required: false
        type: string

permissions:
  contents: write
  # id-token is required for Sigstore keyless signing (GitHub OIDC).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a tag ref
        # Keyless identity is derived from the ref the run executes on, not from
        # what the job checks out. A dispatch from main would sign with
        # ...release.yml@refs/heads/main and silently break the identity that
        # consumers pin, so a release may only originate from a tag ref:
        #   push a v*.*.* tag, or: gh workflow run release.yml --ref <tag>
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Release must run from a tag ref; got ${GITHUB_REF}."
            echo "Push the v*.*.* tag, or dispatch on the tag: gh workflow run release.yml --ref <tag>"
            exit 1
          fi
          if [ -n "${{ inputs.tag }}" ] && [ "${{ inputs.tag }}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Input tag '${{ inputs.tag }}' does not match the run ref '${GITHUB_REF_NAME}'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist

      - name: Assert the built version matches the tag
        # PyPI never allows a filename to be reused, so publishing a
        # distribution whose version does not match its tag permanently burns
        # that version number on a mismatched artifact. Fail before anything is
        # signed, released, or uploaded.
        run: |
          set -euo pipefail
          tag="${{ steps.ref.outputs.tag }}"
          expected="${tag#v}"
          esc="${expected//./\\.}"
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Build produced no distributions in dist/."
            exit 1
          fi
          for f in "${files[@]}"; do
            base="$(basename "$f")"
            if ! grep -Eq "(^|[-_])${esc}([-_.]|$)" <<< "$base"; then
              echo "::error::'$base' does not carry tag version '$expected' (tag '$tag')."
              echo "::error::Bump the version in pyproject.toml to match the tag before tagging."
              exit 1
            fi
          done
          echo "version/tag check passed: $expected"

      - name: Assert the CLI reports the tag version
        # The filename check above reads the version from the build backend.
        # The CLI reads it from the package source. Those were two separate
        # literals and they drifted: 0.3.0 through 0.3.3 all shipped a wheel
        # whose own '--version' printed 0.2.0. A verifier that cannot state its
        # own version correctly is not a credible provenance tool, so assert
        # the runtime string against the tag as well.
        run: |
          set -euo pipefail
          expected="${{ steps.ref.outputs.tag }}"
          expected="${expected#v}"
          reported="$(PYTHONPATH=src python -c 'import witnessos_verifier as m; print(m.__version__)')"
          if [ "$reported" != "$expected" ]; then
            echo "::error::Package reports version '$reported' but the tag is '$expected'."
            echo "::error::Set __version__ in src/witnessos_verifier/__init__.py to match the tag."
            exit 1
          fi
          echo "runtime version check passed: $reported"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./dist
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts with Sigstore keyless
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for f in dist/* sbom.cdx.json; do
            cosign sign-blob --yes --output-signature "${f}.sig" --output-certificate "${f}.pem" "$f"
            echo "signed: $f"
          done

      - name: Create checksums
        run: |
          # sha256sum -- * already covers the distributions AND their .sig/.pem
          # siblings, so only the repo-root SBOM artifacts are appended here.
          # Prefixing duplicate entries with dist/ made 'sha256sum -c' report
          # FAILED for files it had just verified.
          cd dist && sha256sum -- * > SHA256SUMS && cd ..
          sha256sum sbom.cdx.json sbom.cdx.json.sig sbom.cdx.json.pem >> dist/SHA256SUMS

      - name: Keep the built distributions for publishing
        # Distributions only. The PyPI upload action rejects any file in its
        # packages-dir that is not a wheel or sdist, so shipping the checksums
        # and signature files inside this artifact fails the publish outright:
        #   InvalidDistribution: Unknown distribution format: 'SHA256SUMS'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          files: |
            dist/*
            sbom.cdx.json
            sbom.cdx.json.sig
            sbom.cdx.json.pem
          generate_release_notes: true

  publish:
    # PyPI trusted publishing (OIDC, no API token, no stored secret).
    # Held closed until the project's pending publisher exists on PyPI and the
    # repository variable PYPI_PUBLISH_ENABLED is 'true', so a tag push never
    # leaves a failed run merely because the publisher is not configured yet.
    # PyPI publisher fields to match exactly: owner narko4u, repository
    # witnessos-verifier, workflow release.yml, environment pypi.
    needs: release
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch the distributions built by the release job
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Assert the upload payload is only distributions
        # Fail loudly rather than let the publisher discover a stray file. An
        # unsupported filename in dist/ aborts the whole upload, so this
        # assertion names the offending file before the exchange with PyPI.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No distributions were found in dist/."
            exit 1
          fi
          for f in "${files[@]}"; do
            case "$(basename "$f")" in
              *.whl|*.tar.gz) ;;
              *)
                echo "::error::Not a distribution: $(basename "$f")"
                echo "::error::PyPI accepts only wheels and sdists in the upload payload."
                exit 1
                ;;
            esac
          done
          echo "payload is distributions only:"
          ls -1 dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Fail loudly rather than silently re-attaching to an existing file.
          attestations: true
