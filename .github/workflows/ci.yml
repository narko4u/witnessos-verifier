name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows-lint:
    name: Workflows lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned + checksum-verified through the Go module proxy (sum.golang.org).
      # Catches the class of bug that silently killed release runs on 20 Aug 2026:
      # an invalid expression (${{ GITHUB_REF_NAME }}) makes GitHub reject the whole
      # workflow file, producing a zero-job "workflow file issue" failure.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: |
          ACTIONLINT="$(go env GOPATH)/bin/actionlint"
          "$ACTIONLINT" -color

  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify all commits carry Signed-off-by (DCO)
        run: |
          set -e
          BASE="${GITHUB_EVENT_PULL_REQUEST_BASE_SHA:-${{ github.event.pull_request.base.sha }}}"
          HEAD="${GITHUB_EVENT_PULL_REQUEST_HEAD_SHA:-${{ github.event.pull_request.head.sha }}}"
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "Skipping DCO check outside pull_request context"
            exit 0
          fi
          bad=""
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q "^Signed-off-by: "; then
              echo "::error::commit $c is missing Signed-off-by trailer (DCO)"
              bad=1
            fi
          done
          if [ -n "$bad" ]; then
            echo "All commits must include a Signed-off-by trailer. Use: git commit -s"
            exit 1
          fi
          echo "DCO check passed"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Create venv and install package (matches local dev layout)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install . pytest pytest-cov
      - name: Run tests
        run: .venv/bin/python -m pytest --cov=witnessos_verifier --cov-report=term-missing
      - name: Verify CLI entry point and its self-reported version
        run: |
          set -euo pipefail
          # This assertion must be ABLE to fail. The previous form was
          # `... --version || ... || echo "CLI entry name varies"`, which always
          # exits 0 and therefore could never report the defect found on
          # 2026-10-04: the 0.3.0 wheel reported version 0.2.0.
          REPORTED="$(.venv/bin/witnessos-verifier --version | sed -E 's/.*version[ ,]+//' | tr -d '[:space:]')"
          DECLARED="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pyproject.toml | head -1)"
          echo "reported: $REPORTED / declared: $DECLARED"
          if [ "$REPORTED" != "$DECLARED" ]; then
            echo "::error::the installed CLI reports $REPORTED but pyproject.toml declares $DECLARED"
            exit 1
          fi

  release-artifact:
    name: Built artifact gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      # Proves every external claim against the artefact a user installs, from a
      # clean virtualenv that cannot see the source tree: version self-consistency
      # and the real grade and exit code for both shipped fixtures.
      - name: Verify the built artifact
        run: bash scripts/verify_release_artifact.sh
